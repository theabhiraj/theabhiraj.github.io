<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhiraj's Projects</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="main-container">
        <div class="hero-bg"></div>
        <div class="floating-orb orb1"></div>
        <div class="floating-orb orb2"></div>

        <div class="content-wrapper">
            <!-- Header -->
            <header class="header">
                <h1 class="main-title">Abhiraj's Universe</h1>
                <div class="social-links">
                    <a href="https://theabhiraj.github.io/portfolio" class="social-btn portfolio">
                        <i class="fas fa-user-circle"></i>
                        <span>Portfolio</span>
                    </a>
                    <a href="https://github.com/theabhiraj" class="social-btn github">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://instagram.com/theabhirajrathod" class="social-btn instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>

            <main class="projects-container">
                <h2 class="projects-title">Featured Projects</h2>
                <div class="projects-grid">
                    <a href="Yantra/index.html" class="project-card">
                        <img src="assests/logo/yantra.png" alt="Yantra" class="project-icon">

                        <i class="fas fa-arrow-right project-arrow"></i>
                    </a>
                    <a href="abhiraj's/index.html" class="project-card">

                        <h3 class="project-name">Abhiraj's</h3>
                        <i class="fas fa-arrow-right project-arrow"></i>
                    </a>
                    <a href="TTKid/index.html" class="project-card">
                        <img src="assests/logo/ttkid.png" alt="TTKid" class="project-icon">
                        <h3 class="project-name">TTKid</h3>
                        <i class="fas fa-arrow-right project-arrow"></i>
                    </a>
                </div>
            </main>

            <!-- Footer -->
            <footer class="footer">
                <p>© 2024 Abhiraj. Crafted with passion and code.</p>
            </footer>
        </div>
    </div>
</body>

</html>
